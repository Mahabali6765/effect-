<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Filled Rainbow Heart</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
  }
  .top-text {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 3px;
    color: #ff4d6d;
    margin-bottom: 12px;
    text-shadow: 0 0 14px rgba(255,77,109,0.9);
    animation: blinkText 1.2s infinite;
  }
  canvas {
    display: block;
    background: #000;
  }
  .love-text {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: 4px;
    color: #ff4d6d;
    margin-top: 12px;
    min-height: 40px;
    text-shadow: 0 0 15px rgba(255,77,109,0.7);
  }
  .chuhiya {
    margin-top: 8px;
    font-size: 1.45rem;
    font-weight: 600;
    letter-spacing: 3px;
    color: #ff85a1;
    text-shadow: 0 0 12px rgba(255,133,161,0.7);
    animation: blinkText 1.2s infinite;
  }
  .cursor {
    display: inline-block;
    width: 3px;
    height: 26px;
    background: #ff4d6d;
    margin-left: 3px;
    animation: blink 0.7s infinite;
    vertical-align: middle;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  @keyframes blinkText { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</head>
<body>

<div class="top-text">X_MAHABALI</div>
<canvas id="c" width="500" height="480"></canvas>
<div class="love-text"><span id="text"></span><span class="cursor"></span></div>
<div class="chuhiya">CHUHIYA</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const cx = 250;
const cy = 255;

function heartX(t) {
  return 16 * Math.pow(Math.sin(t), 3);
}
function heartY(t) {
  return 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
}

let progress = 0;
const maxLayers = 28;        // andar tak layers
const pointsPerLayer = 90;

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.14)";
  ctx.fillRect(0, 0, 500, 480);

  ctx.lineWidth = 2.2;
  ctx.lineCap = "round";
  ctx.shadowBlur = 10;
  ctx.shadowColor = "rgba(255,100,150,0.5)";

  // Multiple layers from center to outside → full fill
  for (let layer = 0; layer <= Math.min(progress, maxLayers); layer++) {
    const scale = 0.9 + layer * 0.42;     // chhote se bada
    const hueBase = layer * 12 + progress * 2;

    for (let i = 0; i < pointsPerLayer; i++) {
      const t = (i / pointsPerLayer) * Math.PI * 2;
      const x = cx + heartX(t) * scale;
      const y = cy - heartY(t) * scale;

      const hue = (hueBase + i * 2) % 360;
      ctx.fillStyle = `hsl(${hue}, 100%, 58%)`;
      ctx.strokeStyle = `hsl(${hue}, 100%, 58%)`;

      ctx.beginPath();
      ctx.arc(x, y, 2.1, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  progress += 0.35;   // slow + smooth fill

  if (progress > maxLayers + 6) {
    setTimeout(() => {
      progress = 0;
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, 500, 480);
      requestAnimationFrame(draw);
    }, 2300);
  } else {
    requestAnimationFrame(draw);
  }
}

draw();

// Typewriter
const txt = "I LOVE YOU";
const el = document.getElementById("text");
let idx = 0, del = false;

function type() {
  if (!del && idx <= txt.length) {
    el.textContent = txt.substring(0, idx);
    idx++;
    setTimeout(type, 150);
  } else if (!del && idx > txt.length) {
    setTimeout(() => { del = true; type(); }, 2000);
  } else if (del && idx >= 0) {
    el.textContent = txt.substring(0, idx);
    idx--;
    setTimeout(type, 55);
  } else {
    del = false;
    idx = 0;
    setTimeout(type, 700);
  }
}
type();
</script>
</body>
</html>
